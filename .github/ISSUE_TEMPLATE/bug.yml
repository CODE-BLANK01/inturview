name: Bug
description: Something that's broken
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      placeholder: inturview.com / staging / local · browser · light or dark
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      render: text
