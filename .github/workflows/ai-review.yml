name: AI review

# Opt-in: runs only when someone adds the `ai-review` label, so we pay per
# request. Remove and re-add the label to review again after new commits.
on:
  pull_request:
    types: [labeled]

jobs:
  review:
    if: github.event.label.name == 'ai-review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip without an API key
        if: env.HAS_KEY != 'true'
        run: echo "::warning::ANTHROPIC_API_KEY is not set; add it in repo secrets to use AI review."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for inturview, an AI mock-interview app
            (Next.js 14, Prisma/Postgres, Stripe, a Python realtime service).
            The PR branch is checked out in the working directory.

            Look hardest at what costs money or data if it's wrong:
            - prisma/schema.prisma and prisma/migrations: anything that drops or
              rewrites data, or a schema change without a migration
            - lib/plans.ts: caps and prices that don't increase tier to tier, or
              plans that cost more in AI usage than they charge
            - auth, password reset, 2FA, sessions: account takeover risks
            - billing and the Stripe webhook: double grants, missed expiry
            - analytics: events must never include transcripts, answers, code
              or email addresses
            - new process.env usage that isn't in .env.local.example

            Then bugs, then anything confusing to the next reader. Skip style
            nits that lint already enforces.

            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for issues on specific lines, and one
            `gh pr comment` with a short summary: what the PR does, the riskiest
            part, and whether you'd merge it. Only post GitHub comments.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
