name: Discord alerts

# Posts to the team channel. Silent until the DISCORD_WEBHOOK_URL repo secret exists.
on:
  pull_request:
    types: [opened, ready_for_review, closed]
  push:
    branches: [dev, main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev, main]
  deployment_status:

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Skip when no webhook is configured
        if: env.DISCORD_WEBHOOK_URL == ''
        run: echo "DISCORD_WEBHOOK_URL is not set; nothing to post."
      - uses: actions/github-script@v7
        if: env.DISCORD_WEBHOOK_URL != ''
        with:
          script: |
            const { owner, repo } = context.repo;
            const ev = context.eventName;
            const p = context.payload;
            const COLORS = { info: 0x6b5e54, good: 0x2d6a3f, bad: 0x8b1a1a, warn: 0xc4541a };
            let embed = null;

            if (ev === "pull_request") {
              const pr = p.pull_request;
              if (p.action === "closed" && !pr.merged) return;
              if (pr.draft && p.action === "opened") return;
              const merged = p.action === "closed";
              embed = {
                title: `${merged ? "Merged" : "Opened"} #${pr.number}: ${pr.title}`.slice(0, 250),
                url: pr.html_url,
                color: merged ? COLORS.good : COLORS.info,
                description: merged
                  ? `**${pr.merged_by?.login ?? pr.user.login}** merged into \`${pr.base.ref}\``
                  : `**${pr.user.login}** wants to merge into \`${pr.base.ref}\` · +${pr.additions ?? 0} −${pr.deletions ?? 0} in ${pr.changed_files ?? "?"} files`,
              };
            }

            if (ev === "push") {
              // Flag commits that reached dev/main without a pull request.
              const branch = p.ref.replace("refs/heads/", "");
              const direct = [];
              for (const c of p.commits ?? []) {
                const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: c.id });
                if (!prs.some((pr) => pr.merged_at)) direct.push(c);
              }
              if (!direct.length) return;
              embed = {
                title: `Direct push to ${branch}`,
                url: p.compare,
                color: COLORS.warn,
                description: [
                  `**${p.pusher?.name ?? p.sender?.login}** pushed ${direct.length} commit(s) without a pull request:`,
                  ...direct.slice(0, 8).map((c) => `• \`${c.id.slice(0, 7)}\` ${c.message.split("\n")[0].slice(0, 90)}`),
                ].join("\n"),
              };
            }

            if (ev === "workflow_run") {
              const run = p.workflow_run;
              if (run.conclusion !== "failure") return;
              embed = {
                title: `CI failed on ${run.head_branch}`,
                url: run.html_url,
                color: COLORS.bad,
                description: `\`${run.head_sha.slice(0, 7)}\` ${run.display_title} · triggered by **${run.actor?.login}**`,
              };
            }

            if (ev === "deployment_status") {
              const d = p.deployment_status;
              const env = p.deployment.environment ?? "";
              // Only production deploys; previews would be noisy.
              if (!/production/i.test(env)) return;
              if (!["success", "failure", "error"].includes(d.state)) return;
              const ok = d.state === "success";
              embed = {
                title: ok ? "Deployed to production" : "Production deploy failed",
                url: d.target_url || d.log_url || undefined,
                color: ok ? COLORS.good : COLORS.bad,
                description: `\`${p.deployment.sha.slice(0, 7)}\` · ${env}`,
              };
            }

            if (!embed) return;
            const res = await fetch(process.env.DISCORD_WEBHOOK_URL, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ username: "inturview CI", embeds: [embed] }),
            });
            if (!res.ok) core.warning(`Discord returned ${res.status}`);
