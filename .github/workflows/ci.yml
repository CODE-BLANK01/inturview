name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App · typecheck, lint, env, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Every env var is documented
        run: npm run check:env
      - name: Every color comes from lib/theme.ts
        run: npm run check:colors
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build

  database:
    name: Database · migrations apply, access-control tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intervue_test
          # Not UTC on purpose: catches SQL that reads zone-less UTC columns in the session's zone.
          TZ: America/Los_Angeles
          PGTZ: America/Los_Angeles
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway service container; not a secret.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intervue_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Every migration applies to an empty database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Workspace isolation and permission tests
        run: npm run test:db

  e2e:
    name: End-to-end · Hire, applicant and reviewer journeys
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intervue_e2e
          TZ: America/Los_Angeles
          PGTZ: America/Los_Angeles
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway service container; not a real credential.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intervue_e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate a throwaway auth secret
        run: echo "NEXTAUTH_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Migrate the test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Run the journeys (AI faked, email logged)
        run: npm run test:e2e
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  realtime:
    name: Realtime service · lint, import
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/realtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/realtime/requirements.txt
      - run: pip install -r requirements.txt ruff==0.6.9
      - name: Lint
        run: ruff check app
      - name: Service imports with throwaway config
        # Random per run, so nothing secret-shaped lives in this file.
        run: |
          export OPENAI_API_KEY=unused
          export REALTIME_SERVICE_SECRET="$(openssl rand -hex 24)"
          python -c "import app.main"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks on the new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="-1"
          else
            RANGE="$BEFORE..$AFTER"
          fi
          echo "Scanning $RANGE"
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --redact --no-banner --log-opts="$RANGE"
