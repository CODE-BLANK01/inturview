name: Preview review

# Runs when Netlify finishes a deploy preview: screenshots the public pages and
# reports overflow, console errors and reveal flashes on the PR.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Preview URL to review
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       !contains(github.event.deployment.environment, 'roduction'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Screenshot and check pages
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url || inputs.url }}
        run: |
          cp scripts/screenshot-pages.mjs /tmp/pw/
          node /tmp/pw/screenshot-pages.mjs "$PREVIEW_URL" "$PWD/screenshots"
          cat screenshots/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: page-screenshots
          path: screenshots/
          retention-days: 14
      - name: Comment on the PR
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url || inputs.url }}
        with:
          script: |
            const fs = require("fs");
            const sha = context.payload.deployment?.sha;
            if (!sha) return core.info("Manual run; summary is in the job page.");
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha });
            const pr = prs.find((p) => p.state === "open");
            if (!pr) return core.info("No open PR for this deploy.");
            const marker = "<!-- preview-review -->";
            const body = [
              marker,
              fs.readFileSync("screenshots/summary.md", "utf8"),
              "",
              `Preview: ${process.env.PREVIEW_URL} · [20 screenshots](${process.env.ARTIFACT_URL}) · commit \`${sha.slice(0, 7)}\``,
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
